org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Force Java 18 for Gradle (escape backslashes for Windows path)
org.gradle.java.home=C:\\Program Files\\Java\\jdk-18

# Proxy settings (Clash/V2Ray default port)
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890

# Suppress compileSdk 37 warning with AGP 8.2.2
android.suppressUnsupportedCompileSdk=37
